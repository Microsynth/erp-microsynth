{% extends "templates/web.html" %}

{% block page_content %}
<div class="material-counter">
    <div class="section-body">
        <div class="row">
            <div class="form-column col-sm-4">
                <div class="counter-field warehouse-field">
                    <label class="control-label" for="warehouse">Warehouse</label>
                    <div class="input-group">
                        <span class="input-group-addon"><i class="fa fa-cube"></i></span>
                        <input type="text" class="form-control" placeholder="Warehouse" id="warehouse" readonly>
                    </div>
                </div>
                <div class="counter-field">
                    <label class="control-label" for="processes">Process</label>
                    <div class="input-group">
                        <span class="input-group-addon"><i class="fa fa-users"></i></span>
                        <select class="form-control" placeholder="Process" id="processes" onchange="get_users_for_process(this)">
                        </select>
                    </div>
                </div>
                <div class="counter-field">
                    <label class="control-label" for="users">User</label>
                    <div class="input-group">
                        <span class="input-group-addon"><i class="fa fa-user"></i></span>
                        <select class="form-control" placeholder="User" id="users" onchange="focus_on_scanner_input()">
                        </select>
                    </div>
                </div>
                <!-- Scanner Input -->
                <div class="counter-field scanner-field">
                    <label class="control-label" for="scanner_input">Scan Item</label>
                    <div class="input-group">
                        <span class="input-group-addon"><i class="fa fa-barcode"></i></span>
                        <input type="text" class="form-control" placeholder="Scan Data Matrix Code" id="scanner_input" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
                    </div>
                </div>
            </div>
        </div>
    </div>

<!-- Item Table -->
<table class="table table-bordered" id="item_table">
    <thead>
        <tr>
            <th scope="col" class="action-column" aria-label="Action"><span class="desktop-heading">Action</span></th>
            <th scope="col" class="item-column">Item</th>
            <th scope="col" class="item-name-column">Item Name</th>
            <th scope="col" class="material-code-column"><span class="desktop-heading">Material Code</span><span class="mobile-heading">Material / Name</span></th>
            <th scope="col" class="quantity-column"><span class="desktop-heading">Quantity</span><span class="mobile-heading">Qty</span></th>
            <th scope="col" class="batch-column">Batch No</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<!-- Checkout Button -->
<div class="checkout-actions">
    <button type="button" class="btn btn-primary" id="checkout_button">Check Out</button>
</div>
</div>

{% endblock %}
